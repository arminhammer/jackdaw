# Weekly version updates, each ecosystem's in one grouped PR. Security updates come separately, as they happen.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned on purpose: 1.99.0 matches rust-toolchain.toml and 1.94 is the MSRV.
      - dependency-name: "dtolnay/rust-toolchain"
