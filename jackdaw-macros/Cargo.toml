[package]
name = "jackdaw-macros"
version = "0.1.1"
edition = "2024"
authors = ["Armin Graf"]
description = "Procedural macros for the jackdaw durable workflow engine (#[task], #[workflow], #[catalog])"
repository = "https://github.com/arminhammer/jackdaw"
license = "Apache-2.0"
keywords = ["serverless", "workflow", "macros", "durable"]
categories = ["development-tools", "asynchronous"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }

[lints]
workspace = true
