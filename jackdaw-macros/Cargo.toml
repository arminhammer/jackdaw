[package]
name = "jackdaw-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for the jackdaw durable workflow engine (#[task], #[workflow], #[catalog])"
keywords = ["serverless", "workflow", "macros", "durable"]
include = ["/src/**/*", "/README.md"]
readme = "README.md"
documentation = "https://docs.rs/jackdaw-macros"
categories = ["development-tools", "asynchronous"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }

[lints]
workspace = true
