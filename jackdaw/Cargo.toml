[package]
name = "jackdaw"
version = "0.1.1"
edition = "2024"
authors = ["Armin Graf"]
description = "A durable, cached, graph-based execution engine for Serverless Workflow"
documentation = "https://docs.rs/jackdaw"
readme = "../README.md"
repository = "https://github.com/arminhammer/jackdaw"
license = "Apache-2.0"
keywords = ["serverless", "workflow", "engine", "durable", "orchestration"]
categories = ["development-tools", "asynchronous"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
metrics = { version = "0.24", optional = true }
snafu = "0.8.9"
serverless_workflow_core = { workspace = true }
console = "0.15"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
jaq-core = "2.2.1"
jaq-std = "2.1"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
axum = "0.7.5"
base64 = "0.22"

tonic = "0.14"
tonic-reflection = "0.14"
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
prost-types = "0.13"
protox = "0.7"
tower = "0.5"
http = "1"
http-body = "1"
http-body-util = "0.1"
openapiv3-extended = { version = "6.0", features = ["v2"] }
redb = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "chrono", "json", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
bollard = "0.18"

petgraph = "0.6"
async-recursion = "1.0"
futures = "0.3"
sha2 = "0.10.9"
schemars = "1"
jackdaw-macros = { path = "../jackdaw-macros", version = "0.1.1" }
hyper = { version = "1.8.1", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }

[features]
default = []
# Counters and histograms through the `metrics` facade. The library never installs a recorder.
metrics = ["dep:metrics"]

[dev-dependencies]
jackdaw = { path = ".", features = ["metrics"] }
metrics = "0.24"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
cucumber = "0.21"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
wiremock = "0.6.5"
serial_test = "3"
trybuild = "1"
tokio = { version = "1", features = ["full", "test-util"] }

[[test]]
name = "ctk_conformance"
harness = false

[[test]]
name = "listener_tests"
harness = false

[[test]]
name = "nested_workflow_tests"
harness = false

[[test]]
name = "validate_tests"

[[test]]
name = "lib_features"
harness = false

[[test]]
name = "example_tests"
harness = false

[[test]]
name = "docker_integration_tests"
required-features = []

[lints]
workspace = true
