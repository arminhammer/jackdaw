[package]
# Published as jackdaw-wf (the `jackdaw` name on crates.io is taken); the library is still imported as `jackdaw`.
name = "jackdaw-wf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A durable, cached, graph-based execution engine for the Open Workflow DSL (formerly Serverless Workflow)"
documentation = "https://docs.rs/jackdaw-wf"
readme = "README.md"
# An allowlist, so tests, fixtures and work in progress stay out of the published crate.
include = ["/src/**/*", "/examples/*.rs", "/README.md"]
keywords = ["serverless", "workflow", "engine", "durable", "orchestration"]
categories = ["development-tools", "asynchronous"]

[lib]
name = "jackdaw"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
jackdaw-macros = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }
tracing = "0.1"
snafu = "0.9.2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
futures = "0.3"
sha2 = "0.11"
schemars = "1"
metrics = { version = "0.24", optional = true }

# config
figment = { version = "0.10", default-features = false, features = ["toml", "json"], optional = true }

# yaml
serde_derive = { version = "1", optional = true }
jaq-core = { version = "3.1.2", optional = true }
jaq-std = { version = "3.0", optional = true }
jaq-json = { version = "2.0.3", features = ["serde"], optional = true }
regex = { version = "1", optional = true }
petgraph = { version = "0.8", optional = true }
async-recursion = { version = "1.0", optional = true }

# stores
redb = { version = "4", optional = true }

# What needs an operating system underneath: child processes, sockets, C libraries, Docker, and the HTTP client (reqwest
# on wasm is the browser's `fetch`, which cannot run on WASI and whose futures are not `Send`). On wasm none of it is
# built, and what uses it is left out or fails with a message that says so: `ctx.run_shell`, `ctx.run_script`, `ctx.http`,
# YAML `run: shell`, `call: http` and remote catalogs; the features `sqlite`, `postgres`, `docker`, `http-listener`,
# `grpc-listener` and `openapi` stop the build with a message (see `lib.rs`). `http-client` does nothing there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# `rt-multi-thread` is for the listeners' `block_in_place`; it adds no crates. Their sockets come from axum, hyper-util and
# tonic, which ask tokio for `net` themselves.
tokio = { version = "1", features = ["process", "rt-multi-thread"] }
# terminal, cli
indicatif = { version = "0.18", optional = true }
console = { version = "0.16", optional = true }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "string"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"], optional = true }

# sqlite, postgres
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "chrono", "json", "uuid"], optional = true }

# openapi
openapiv3-extended = { version = "6.0", features = ["v2"], optional = true }

# docker
bollard = { version = "0.21", optional = true }

# http-listener
axum = { version = "0.8", optional = true }
# OpenAPI request validation in the engine's HTTP listener. Without default features: no remote `$ref`s, no C TLS.
jsonschema = { version = "0.60", default-features = false, optional = true }

# grpc-listener
tonic = { version = "0.14", optional = true }
tonic-reflection = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
prost-reflect = { version = "0.16", features = ["serde"], optional = true }
prost-types = { version = "0.14", optional = true }
protox = { version = "0.10", optional = true }
tower = { version = "0.5", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.8.1", features = ["server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"], optional = true }
bytes = { version = "1", optional = true }

[features]
default = ["yaml", "redb", "http-client"]
# Everything, as the CLI uses it.
full = ["yaml", "redb", "sqlite", "postgres", "http-client", "openapi", "docker", "http-listener", "grpc-listener", "metrics", "config", "terminal", "cli"]

# The Open Workflow YAML interpreter: `jackdaw::dsl`, `api::Workflow` (`from_yaml`, `validate`),
# `ctx.run_definition` and the engine's YAML registrations. YAML `call: http` needs an HTTP client, so this
# includes `http-client`.
yaml = ["http-client", "dep:serde_derive", "dep:jaq-core", "dep:jaq-std", "dep:jaq-json", "dep:regex", "dep:petgraph", "dep:async-recursion"]

# Stores and caches.
redb = ["dep:redb"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]

# `ctx.http`, and remote catalogs.
http-client = ["dep:reqwest"]
# YAML `call: openapi`.
openapi = ["yaml", "dep:openapiv3-extended"]
# `ctx.run_container` and YAML `run: container`, through the Docker API.
docker = ["dep:bollard"]
# `api::Listener` (the engine serves HTTP routes or a gRPC service whose requests start workflows), and YAML
# `listen` tasks on HTTP (OpenAPI) and gRPC.
http-listener = ["dep:axum", "dep:jsonschema"]
grpc-listener = ["dep:tonic", "dep:tonic-reflection", "dep:prost", "dep:prost-reflect", "dep:prost-types", "dep:protox", "dep:tower", "dep:http", "dep:http-body", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:bytes"]

# `jackdaw::config`: a workflow's input read from defaults, files (toml, json, yaml), environment variables and arguments.
config = ["dep:figment"]

# `runner::Terminal`, the progress bars of a `Runner` in a terminal. The rest of `runner` needs no feature.
terminal = ["dep:indicatif", "dep:console"]
# `runner::RunnerArgs`, the command line flags of a `Runner`, for programs that use `clap`.
cli = ["terminal", "config", "dep:clap"]

# Counters and histograms through the `metrics` facade. The library never installs a recorder.
metrics = ["dep:metrics"]

[dev-dependencies]
tempfile = "3"
# The vendored SDK unit tests serialize YAML.
serde-saphyr = { version = "2", default-features = false, features = ["deserialize", "serialize"] }
jackdaw = { package = "jackdaw-wf", path = ".", features = ["full"] }
metrics = "0.24"
indicatif = { version = "0.18", features = ["in_memory"] }
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
cucumber = "0.23"
testcontainers = "0.28"
wiremock = "0.6.5"
serial_test = "3"
trybuild = "1"
tokio = { version = "1", features = ["full", "test-util"] }

[[test]]
name = "ctk_conformance"
harness = false

[[test]]
name = "listener_tests"
harness = false

[[test]]
name = "nested_workflow_tests"
harness = false

[[test]]
name = "validate_tests"

[[test]]
name = "lib_features"
harness = false

[[test]]
name = "example_tests"
harness = false

[[test]]
name = "docker_integration_tests"
required-features = []

[lints]
workspace = true
