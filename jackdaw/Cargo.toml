[package]
# Published as jackdaw-wf (the `jackdaw` name on crates.io is taken); the library is still imported as `jackdaw`.
name = "jackdaw-wf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A durable, cached, graph-based execution engine for the Open Workflow DSL (formerly Serverless Workflow)"
documentation = "https://docs.rs/jackdaw-wf"
readme = "README.md"
# An allowlist, so tests, fixtures and work in progress stay out of the published crate.
include = ["/src/**/*", "/examples/*.rs", "/README.md"]
keywords = ["serverless", "workflow", "engine", "durable", "orchestration"]
categories = ["development-tools", "asynchronous"]

[lib]
name = "jackdaw"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
jackdaw-macros = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "io-util", "process"] }
tracing = "0.1"
snafu = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
futures = "0.3"
sha2 = "0.10.9"
schemars = "1"
metrics = { version = "0.24", optional = true }

# yaml
serde_derive = { version = "1", optional = true }
jaq-core = { version = "2.2.1", optional = true }
jaq-std = { version = "2.1", optional = true }
jaq-json = { version = "1.1.3", features = ["serde_json"], optional = true }
regex = { version = "1", optional = true }
petgraph = { version = "0.6", optional = true }
async-recursion = { version = "1.0", optional = true }
console = { version = "0.15", optional = true }

# stores
redb = { version = "2", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "chrono", "json", "uuid"], optional = true }

# http-client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"], optional = true }

# openapi
openapiv3-extended = { version = "6.0", features = ["v2"], optional = true }

# docker
bollard = { version = "0.20", optional = true }

# http-listener
axum = { version = "0.8", optional = true }

# grpc-listener
tonic = { version = "0.14", optional = true }
tonic-reflection = { version = "0.14", optional = true }
prost = { version = "0.13", optional = true }
prost-reflect = { version = "0.14", features = ["serde"], optional = true }
prost-types = { version = "0.13", optional = true }
protox = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.8.1", features = ["server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"], optional = true }
bytes = { version = "1", optional = true }

[features]
default = ["yaml", "redb", "http-client"]
# Everything, as the CLI uses it.
full = ["yaml", "redb", "sqlite", "postgres", "http-client", "openapi", "docker", "http-listener", "grpc-listener", "metrics"]

# The Open Workflow YAML interpreter: `jackdaw::dsl`, `api::Workflow` (`from_yaml`, `validate`),
# `ctx.run_definition` and the engine's YAML registrations. YAML `call: http` needs an HTTP client, so this
# includes `http-client`.
yaml = ["http-client", "dep:serde_derive", "dep:jaq-core", "dep:jaq-std", "dep:jaq-json", "dep:regex", "dep:petgraph", "dep:async-recursion", "dep:console", "tokio/rt-multi-thread"]

# Stores and caches.
redb = ["dep:redb"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]

# `ctx.http`, and remote catalogs.
http-client = ["dep:reqwest"]
# YAML `call: openapi`.
openapi = ["yaml", "dep:openapiv3-extended"]
# `ctx.run_container` and YAML `run: container`, through the Docker API.
docker = ["dep:bollard"]
# `api::Listener` (the engine serves HTTP routes or a gRPC service whose requests start workflows), and YAML
# `listen` tasks on HTTP (OpenAPI) and gRPC.
http-listener = ["dep:axum", "tokio/net", "tokio/rt-multi-thread"]
grpc-listener = ["dep:tonic", "dep:tonic-reflection", "dep:prost", "dep:prost-reflect", "dep:prost-types", "dep:protox", "dep:tower", "dep:http", "dep:http-body", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:bytes", "tokio/net", "tokio/rt-multi-thread"]

# Counters and histograms through the `metrics` facade. The library never installs a recorder.
metrics = ["dep:metrics"]

[dev-dependencies]
tempfile = "3"
jackdaw = { package = "jackdaw-wf", path = ".", features = ["full"] }
metrics = "0.24"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
cucumber = "0.21"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
wiremock = "0.6.5"
serial_test = "3"
trybuild = "1"
tokio = { version = "1", features = ["full", "test-util"] }

[[test]]
name = "ctk_conformance"
harness = false

[[test]]
name = "listener_tests"
harness = false

[[test]]
name = "nested_workflow_tests"
harness = false

[[test]]
name = "validate_tests"

[[test]]
name = "lib_features"
harness = false

[[test]]
name = "example_tests"
harness = false

[[test]]
name = "docker_integration_tests"
required-features = []

[lints]
workspace = true
