[workspace]
resolver = "3"
members = [
    "jackdaw",
    "jackdaw-cli",
    "jackdaw-macros"
]

# Shared by all crates. Publish them together: jackdaw's macros expand to paths in jackdaw, so the two are pinned to
# each other with `=` and must have the same version.
[workspace.package]
version = "0.1.1"
edition = "2024"
# The oldest toolchain that builds the workspace and its dependencies (ordered-float needs 1.90).
rust-version = "1.90"
authors = ["Armin Graf"]
license = "Apache-2.0"
repository = "https://github.com/arminhammer/jackdaw"

[workspace.dependencies]
jackdaw = { package = "jackdaw-wf", path = "jackdaw", version = "=0.1.1" }
jackdaw-macros = { package = "jackdaw-wf-macros", path = "jackdaw-macros", version = "=0.1.1" }

[workspace.lints.clippy]
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "deny"
# False positive on #[async_trait] expansions (clippy 1.99)
double_must_use = "allow"

# Optimized release profile for smaller, faster binaries
[profile.release]
opt-level = "z"          # Optimize for size
lto = true               # Enable Link Time Optimization
codegen-units = 1        # Better optimization, slower compile
strip = true             # Strip symbols from binary
panic = "abort"          # Smaller binary, no unwinding

# Profile for release with debug info (useful for profiling production issues)
[profile.release-with-debug]
inherits = "release"
strip = false
debug = true
