[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "jackdaw"
version = "0.1.1"
description = "A durable, cached, graph-based execution engine for Serverless Workflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Armin Graf" }
]
keywords = ["serverless", "workflow", "engine", "durable", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]
dependencies = [
    "serverlessworkflow-sdk @ git+https://github.com/arminhammer/sdk-python@1.0-rewrite",
    "dill>=0.3.8",
    # Compiles typed workflow signatures (params + return annotation) into
    # the JSON Schema contracts embedded in exported workflows.
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1",
    "maturin>=1.14.1",
]

[project.urls]
Homepage = "https://github.com/arminhammer/jackdaw"
Documentation = "https://docs.rs/jackdaw"
Repository = "https://github.com/arminhammer/jackdaw"

[tool.uv.sources]
serverlessworkflow-sdk = { path = "../sdk-python" }

[tool.maturin]
features = ["python"]
python-source = "clients/python"
python-packages = ["jackdaw"]
module-name = "jackdaw._jackdaw"

[tool.pytest.ini_options]
testpaths = ["jackdaw/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
