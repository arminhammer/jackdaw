[package]
name = "jackdaw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the jackdaw durable workflow engine"
keywords = ["serverless", "workflow", "cli", "durable", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = ["/src/**/*", "/README.md"]

[[bin]]
name = "jackdaw"
path = "src/main.rs"

[dependencies]
jackdaw = { workspace = true, features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
config = "0.15.15"
console = "0.15"
futures = "0.3"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
snafu = "0.9.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# telemetry
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"], optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"], optional = true }

[features]
default = ["telemetry"]
# `jackdaw run --otlp-endpoint` (traces to an OpenTelemetry collector) and `--metrics-addr` (Prometheus metrics).
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:metrics-exporter-prometheus"]

[dev-dependencies]
cucumber = "0.21"

[[test]]
name = "cli"
harness = false

[lints]
workspace = true

# `cargo binstall jackdaw-cli` downloads the binary from the GitHub release (tag `v<version>`) instead of compiling.
# The asset names match the "Prepare release assets" step in .github/workflows/release-on-merge.yml.
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/jackdaw-{ version }-linux-amd64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/jackdaw-{ version }-linux-amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/jackdaw-{ version }-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/jackdaw-{ version }-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/jackdaw-{ version }-macos-amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/jackdaw-{ version }-macos-arm64.tar.gz"
