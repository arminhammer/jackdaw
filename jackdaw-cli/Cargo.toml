[package]
name = "jackdaw-cli"
version = "0.1.1"
edition = "2024"
authors = ["Armin Graf"]
description = "Command-line interface for the jackdaw durable workflow engine"
repository = "https://github.com/arminhammer/jackdaw"
license = "Apache-2.0"
keywords = ["serverless", "workflow", "cli", "durable", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "jackdaw"
path = "src/main.rs"

[dependencies]
jackdaw = { path = "../jackdaw", version = "0.1.1" }
serverless_workflow_core = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
config = "0.15.15"
console = "0.15"
futures = "0.3"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
snafu = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-indicatif = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
